<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<rect width="100%" height="100%" fill="#fbfaf7"/>
<text x="56" y="58" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#26373e">Signal to execution timing</text>
<text x="56" y="91" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#607178">The default run_ticks() flow, including the configurable one-tick signal-to-fill delay</text>

<style>.b{fill:#f2f6f7;stroke:#3e5b63;stroke-width:2}.t{font-family:Arial,Helvetica,sans-serif;fill:#2d4149}.h{font-size:20px;font-weight:700}.s{font-size:15px}.a{stroke:#6c858d;stroke-width:2.2;fill:none;marker-end:url(#arrow)}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6c858d"/></marker></defs>
<g transform="translate(55,170)"><rect class="b" width="200" height="160" rx="12"/><text class="t h" x="22" y="38">Tick t</text><text class="t s" x="22" y="72">mid prices</text><text class="t s" x="22" y="98">Kalman beta</text><text class="t s" x="22" y="124">rolling z-score</text></g>
<g transform="translate(310,170)"><rect class="b" width="200" height="160" rx="12"/><text class="t h" x="22" y="38">Signal</text><text class="t s" x="22" y="72">desired position</text><text class="t s" x="22" y="98">confirmation</text><text class="t s" x="22" y="124">OCO state</text></g>
<g transform="translate(565,170)"><rect class="b" width="200" height="160" rx="12"/><text class="t h" x="22" y="38">Delay</text><text class="t s" x="22" y="72">execution_delay_ticks</text><text class="t s" x="22" y="98">default = 1</text><text class="t s" x="22" y="124">scheduled target</text></g>
<g transform="translate(820,170)"><rect class="b" width="200" height="160" rx="12"/><text class="t h" x="22" y="38">Fill t+1</text><text class="t s" x="22" y="72">bid / ask crossing</text><text class="t s" x="22" y="98">slippage</text><text class="t s" x="22" y="124">commission</text></g>
<g transform="translate(1075,170)"><rect class="b" width="90" height="160" rx="12"/><text class="t h" x="18" y="42">State</text><text class="t s" x="15" y="78">cash</text><text class="t s" x="15" y="104">A / B</text><text class="t s" x="15" y="130">risk</text></g>
<path class="a" d="M255 250 L310 250"/><path class="a" d="M510 250 L565 250"/><path class="a" d="M765 250 L820 250"/><path class="a" d="M1020 250 L1075 250"/>
<text class="t s" x="55" y="405">The one-tick delay is part of the research model so a signal is not filled on the same quote that generated it.</text>

</svg>