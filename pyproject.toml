[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-statarb"
version = "0.1.0"
description = "Latency-aware statistical arbitrage research and simulated execution stack"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26,<3",
  "pyzmq>=25,<28",
]

[project.optional-dependencies]
research = [
  "scipy>=1.11,<2",
  "pandas>=2.0,<4",
]
live = [
  "cryptofeed @ git+https://github.com/bmoscon/cryptofeed.git@6cbd9b959f104fe970791d32444a2ef13ddacc2f",
]
storage = [
  "duckdb>=1.3,<2",
  "pandas>=2.0,<4",
]
dev = [
  "pytest>=8,<10",
]
full = [
  "scipy>=1.11,<2",
  "pandas>=2.0,<4",
  "duckdb>=1.3,<2",
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
